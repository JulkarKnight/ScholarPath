spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.port=8080
spring.jackson.default-property-inclusion=non_null

# OpenRouter API Configuration
openrouter.api.key=${OPENROUTER_API_KEY:default_missing_key}


# Supabase PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default}
spring.security.oauth2.client.registration.google.scope=profile,email
